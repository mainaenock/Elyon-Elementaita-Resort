name: Deploy GitHub Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Export the static site
        run: |
          # Vinext detects the Worker target from the Cloudflare config filename.
          mv cloudflare.config.ts "$RUNNER_TEMP/elyon-cloudflare.config.ts"
          npm run build
          if [ -n "$NEXT_PUBLIC_ELYON_BASE_PATH" ]; then
            cp dist/client/404.html "dist/client$NEXT_PUBLIC_ELYON_BASE_PATH/404.html"
          fi
        env:
          ELYON_GITHUB_PAGES: "1"
          NEXT_PUBLIC_ELYON_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client${{ steps.pages.outputs.base_path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
